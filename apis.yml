name: Efficient Frontier
description: Efficient Frontier was a digital advertising optimization and search marketing company
  founded in 2002 that applied algorithmic, finance-inspired bid optimization to manage over $1 billion
  in annual marketing spend across search, display, and social (notably Facebook ad buying) for enterprise
  clients such as Discover, Travelodge, and Match.com. Adobe acquired the company in late 2011 (announced
  November 30, 2011; completed January 2012) and folded its multi-channel ad forecasting, execution, and
  optimization capabilities into the Adobe Digital Marketing / Advertising Cloud. The efrontier.com domain
  now redirects to adobe.com and the company has no independent website, developer portal, or public API.
